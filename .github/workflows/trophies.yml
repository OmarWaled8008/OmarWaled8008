
name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  trophies:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=omarwaled8008&theme=darkhub&column=6&no-frame=true'
          path: trophies.svg

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git diff --staged --quiet || git commit -m "Update GitHub trophies"
          git push
